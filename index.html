<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 5 - JS Basics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Daniyar | IT-2504</span>
    </div>
  </nav>

  <div class="container mb-5">
    <h2 class="mb-4">Assignment #5: JS Basics & DOM</h2>

    <div class="row g-4">
      
      <!-- User profile & form -->
      <div class="col-md-6">
        <div class="card p-3 shadow-sm">
          <h4>Profile Info</h4>
          <div class="mb-3">
            <p class="mb-1">Name: <b id="profileName"></b></p>
            <p class="mb-1">Age: <span id="profileAge"></span></p>
            <p class="mb-1">Age in months: <span id="profileMonths"></span></p>
            <p class="mb-1">Developer status: <span id="profileDev"></span></p>
            <p class="mb-1">Hobbies count: <span id="hobbiesCount"></span></p>
          </div>

          <hr>

          <h5>Update Profile</h5>
          <form id="profileForm">
            <div class="mb-2">
              <label class="form-label">Username</label>
              <input type="text" id="userNameInput" class="form-control" placeholder="Enter name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Birth Year</label>
              <input type="number" id="birthYearInput" class="form-control" placeholder="e.g. 2007" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Profile</button>
          </form>
        </div>
      </div>

      <!-- Hobbies list -->
      <div class="col-md-6">
        <div class="card p-3 shadow-sm">
          <h4>Hobbies List</h4>
          
          <div class="input-group mb-3">
            <input type="text" id="hobbyInput" class="form-control" placeholder="New hobby...">
            <button id="addBtn" class="btn btn-success">Add</button>
            <button id="removeBtn" class="btn btn-danger">Remove Last</button>
          </div>

          <ul id="hobbyList" class="list-group"></ul>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
